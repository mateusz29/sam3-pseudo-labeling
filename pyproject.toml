[project]
name = "sam3-image-examples"
version = "0.1.0"
description = "Simple SAM3 text-prompted image examples"
requires-python = ">=3.10"
dependencies = ["torch", "torchvision"]

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.3.0", "opencv-python"]
transformers = ["transformers>=5.0.0", "Pillow"]

[dependency-groups]
dev = ["ruff>=0.9.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

